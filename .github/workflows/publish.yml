name: Publish to npm

# Two things gate this workflow, and both must be true before a release:
#
#   1. The package must already exist on npm. Trusted publishing can only
#      authenticate a package that a maintainer has already created — a very
#      first publish has to be done locally (see CONTRIBUTING.md → Releasing).
#      Verified the hard way: the first tag push reached the registry and got
#      `404 Not Found - PUT https://registry.npmjs.org/dsh-startup-check`.
#
#   2. The repository variable NPM_TRUSTED_PUBLISHER_READY must be "true".
#      The relationship itself is created from the CLI — no need to open
#      npmjs.com, whose web UI may be unreachable from behind a blocked network:
#
#        npm trust github dsh-startup-check \
#          --file publish.yml \
#          --repo cningan/dsh-startup-check \
#          --env npm-publish \
#          --registry https://registry.npmjs.org/
#
#      …then arm this workflow:
#
#        gh variable set NPM_TRUSTED_PUBLISHER_READY --body true \
#          --repo cningan/dsh-startup-check
#
#   3. The npm CLI doing the publish must be version 11.5.1 or newer — it is the
#      first version with OIDC support. This one is easy to get wrong because
#      the Node 22 line still ships npm 10: Node 22.23.2 bundles npm 10.9.8, so
#      the workflow looks healthy, signs a provenance statement, and then sends
#      the publish *unauthenticated* — which the registry answers with a bare
#      `404 Not Found - PUT ...` that mentions nothing about authentication.
#      Hence node-version: '24' below (npm 11.19) and the assertion step.
#
# Until all three hold, publishing from a tag is switched off on purpose: a tag
# push that is guaranteed to fail only teaches everyone to ignore a red X.
# Release locally in the meantime.
#
# After bootstrapping, a release is:
#   npm version patch        # bumps package.json + creates the commit and tag
#   git push --follow-tags

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # to open the GitHub Release for the tag being published
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: windows-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # A tag push still verifies the release (same checks CI runs on main), so a
      # tag is never a no-op — it just does not attempt to publish until the
      # package exists and trusted publishing is armed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Explain the gate
        if: vars.NPM_TRUSTED_PUBLISHER_READY != 'true'
        run: |
          echo "::notice title=Publish skipped::Trusted publishing is not armed yet."
          echo "The package must exist on npm (first publish is done locally) and the"
          echo "repository variable NPM_TRUSTED_PUBLISHER_READY must be 'true'."
          echo "See the header of this file and CONTRIBUTING.md → Releasing."

      # Fail loudly instead of 404-ing mysteriously: without an OIDC-capable
      # npm the publish goes out anonymous and the registry says only
      # "404 Not Found - PUT ...", which reads like a missing package.
      - name: Assert npm can do OIDC
        if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true'
        shell: pwsh
        run: |
          $npmVersion = (npm --version).Trim()
          Write-Host "node $(node --version) / npm $npmVersion"
          if ([version]$npmVersion -lt [version]'11.5.1') {
            Write-Error ("npm $npmVersion is older than 11.5.1, so it cannot exchange an OIDC token. " +
              "Trusted publishing would be skipped and the publish would fail with a bare 404.")
            exit 1
          }

      # --loglevel=verbose is deliberate: the npm CLI swallows OIDC failures at
      # the default level, so a rejected token exchange is otherwise invisible.
      - name: Publish
        if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true'
        run: npm publish --provenance --access public --loglevel=verbose

      # The npm version, the git tag and the release page are three records of
      # one event, so the release is opened here rather than remembered by hand.
      # Tag pushes only: a manual run must not invent a release for a version
      # that is already out.
      - name: Open the GitHub Release
        if: vars.NPM_TRUSTED_PUBLISHER_READY == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "release for v$version"
          gh release create "v$version" --title "v$version" --generate-notes --verify-tag
