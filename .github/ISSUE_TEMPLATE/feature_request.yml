name: Feature request
description: Propose a check, a platform, or a change in behaviour.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem** first. This project prefers a small, sharp surface:
        a check earns its place by catching a failure mode that would otherwise reach
        a user's restart.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What went wrong (or would go wrong) that this feature would catch?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should plugin_check do? New argument, new check, changed output?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing, document it" — sometimes that is the right answer.
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety boundaries
      description: Confirm the proposal respects the plugin's design guarantees.
      options:
        - label: It does not write to the checked profile.
          required: true
        - label: It does not kill a resident harness host.
          required: true
        - label: It does not identify DSH processes by anything other than process identity.
          required: true
